<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickFast - Le jeu de clics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>⚡ ClickFast</h1>
        <p>Clique le plus vite possible en 10 secondes !</p>

        <div id="timer">10</div>
        <div id="score">Score : 0</div>

        <button id="clickButton">CLIQUE !</button>
        <button id="startButton">Commencer</button>

        <p id="message">Prêt à relever le défi ?</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
