name: ClickFast CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clickfast
          POSTGRES_PASSWORD: clickfast_test
          POSTGRES_DB: clickfast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clickfast -d clickfast"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3001
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: clickfast
      DB_PASSWORD: clickfast_test
      DB_NAME: clickfast

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Initialiser la base de test
        run: |
          PGPASSWORD=clickfast_test psql -h localhost -U clickfast -d clickfast -c "CREATE TABLE IF NOT EXISTS scores (id SERIAL PRIMARY KEY, player VARCHAR(100) NOT NULL, score INTEGER NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP);"
        env:
          PGPASSWORD: clickfast_test
        shell: bash

      - name: Lancer les tests
        run: npm test

  build:
    name: Construire et publier l'image Docker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dyacine92/clickfast:${{ github.sha }}
            dyacine92/clickfast:latest
